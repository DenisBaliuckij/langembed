seed: 42
encoder_dir: artifacts/encoder_hi
simcse:
  sentences_path: data/corpus_hi.txt
  out_dir: artifacts/simcse_hi
  batch_size: 32
  epochs: 1
  warmup_steps: 100
  max_seq_length: 128
supervised:
  triplets_path: data/native_triplets_hi.jsonl
  in_dir: artifacts/simcse_hi
  out_dir: artifacts/embed_hi_v1
  batch_size: 32
  epochs: 3
  warmup_steps: 100
vocab:
  min_frequency: 5
  include_bigrams: true
  max_vocab_size: 100000
