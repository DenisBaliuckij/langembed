seed: 42
encoder_dir: artifacts/encoder_ml
simcse:
  sentences_path: data/corpus_ml.txt
  out_dir: artifacts/simcse_ml
  batch_size: 32
  epochs: 1
  warmup_steps: 100
  max_seq_length: 128
supervised:
  triplets_path: data/native_triplets_ml.jsonl
  in_dir: artifacts/simcse_ml
